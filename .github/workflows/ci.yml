name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: dist/ is up to date
        run: |
          npm run build
          git diff --exit-code dist
          untracked="$(git ls-files --others --exclude-standard dist)"
          if [ -n "$untracked" ]; then
            echo "Untracked files in dist/ after build (run npm run build and commit):"
            echo "$untracked"
            exit 1
          fi
